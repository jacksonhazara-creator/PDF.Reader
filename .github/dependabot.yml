version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
    ignore:
      # PDFsharp 6.5+ is AGPL-3.0. Stay on the MIT-licensed 6.2.x line.
      - dependency-name: "PDFsharp"
        versions: [">= 6.3.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
